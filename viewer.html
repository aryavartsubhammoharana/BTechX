<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Document Viewer - BTechX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css?v=15.1">
  <link rel="icon" type="image/png" href="logo.png?v=7">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .viewer-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Top Navigation Bar */
    /* Top Navigation Bar - Ultra-Slim & Space-Saving */
    .viewer-header {
      height: 44px;
      min-height: 44px;
      background: rgba(10, 10, 10, 0.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 50;
      gap: 12px;
    }

    .viewer-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .viewer-brand {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .viewer-brand:hover {
      color: #ffffff;
    }

    .viewer-header-center {
      flex: 1;
      text-align: center;
      overflow: hidden;
      padding: 0 8px;
    }

    .viewer-title {
      font-size: 13.5px;
      font-weight: 500;
      color: #f4f4f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 500px;
      margin: 0 auto;
      letter-spacing: 0.2px;
    }

    .viewer-header-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    /* Clean Frameless Icon Action Buttons (NO bulky boxes) */
    .viewer-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      outline: none;
      color: #d4d4d8;
      cursor: pointer;
      text-decoration: none;
      padding: 6px;
      line-height: 1;
      touch-action: manipulation;
      will-change: transform, color, filter;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  color 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .viewer-icon-btn:hover {
      color: #ffffff;
      transform: scale(1.18);
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
    }

    .viewer-icon-btn:active {
      transform: scale(0.88) !important;
    }

    /* Back Icon: clean arrow */
    .viewer-back-icon {
      font-size: 17px;
      color: #e4e4e7;
    }

    /* Download Icon: prominent pure icon without box */
    .viewer-download-icon {
      font-size: 19px;
      color: #ffffff;
    }

    .viewer-download-icon:hover {
      color: #ffffff;
      transform: scale(1.22);
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.7));
    }

    /* Secondary Tools: External & Fullscreen */
    .viewer-tool-icon {
      font-size: 14.5px;
      color: #71717a;
    }

    .viewer-tool-icon:hover {
      color: #e4e4e7;
    }

    /* Error Card Action Button */
    .error-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13.5px;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .error-back-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }

    /* Main PDF Frame Container */
    .viewer-main {
      flex: 1;
      position: relative;
      background: #09090b;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .viewer-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      display: block;
      flex: 1;
    }

    /* States (Loading & Error) */
    .viewer-state {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050505;
      z-index: 10;
      padding: 24px;
      text-align: center;
    }

    .viewer-state i.fa-spinner {
      color: #ffffff;
      margin-bottom: 16px;
    }

    .viewer-state p {
      color: #a1a1aa;
      font-size: 14px;
    }

    .error-card {
      background: rgba(18, 18, 22, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }

    .error-icon {
      font-size: 3.2rem;
      color: #ef4444;
      margin-bottom: 18px;
    }

    .error-card h2 {
      font-size: 1.25rem;
      margin-bottom: 10px;
      color: #ffffff;
      font-weight: 600;
    }

    .error-card p {
      color: #a1a1aa;
      font-size: 13.5px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .viewer-header {
        height: 42px;
        min-height: 42px;
        padding: 0 10px;
      }
      .viewer-brand {
        display: none;
      }
      .viewer-tool-icon {
        display: none;
      }
      .viewer-title {
        font-size: 13px;
        max-width: 240px;
      }
      .viewer-back-icon {
        font-size: 16px;
      }
      .viewer-download-icon {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="viewer-layout">
    <!-- Header -->
    <header class="viewer-header">
      <div class="viewer-header-left">
        <button id="backBtn" class="viewer-icon-btn viewer-back-icon" onclick="handleBack()" title="Back" aria-label="Back">
          <i class="fas fa-arrow-left"></i>
        </button>
        <a href="index.html" class="viewer-brand">BTechX</a>
      </div>

      <div class="viewer-header-center">
        <h1 id="docTitle" class="viewer-title">Document Viewer</h1>
      </div>

      <div class="viewer-header-right">
        <a id="externalBtn" href="#" target="_blank" class="viewer-icon-btn viewer-tool-icon" title="Open in New Tab" aria-label="Open in New Tab">
          <i class="fas fa-external-link-alt"></i>
        </a>
        <button id="fullscreenBtn" class="viewer-icon-btn viewer-tool-icon" onclick="toggleFullscreen()" title="Fullscreen" aria-label="Toggle Fullscreen">
          <i class="fas fa-expand"></i>
        </button>
        <a id="downloadBtn" href="#" download class="viewer-icon-btn viewer-download-icon" title="Download Document" aria-label="Download Document">
          <i class="fas fa-download"></i>
        </a>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="viewer-main">
      <div id="loadingState" class="viewer-state">
        <i class="fas fa-spinner fa-spin fa-2x"></i>
        <p>Loading document...</p>
      </div>

      <div id="errorState" class="viewer-state" style="display: none;">
        <div class="error-card">
          <i class="fas fa-exclamation-circle error-icon"></i>
          <h2>PDF / Notes Not Available</h2>
          <p id="errorMessage">This study material or question bank has not been uploaded yet. Please check back later.</p>
          <button onclick="handleBack()" class="error-back-btn">
            <i class="fas fa-arrow-left"></i> <span>Return to Previous Page</span>
          </button>
        </div>
      </div>

      <iframe id="pdfFrame" class="viewer-iframe" style="display: none;" allow="fullscreen"></iframe>
    </main>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const fileParam = params.get('file');
    const titleParam = params.get('title');

    const docTitle = document.getElementById('docTitle');
    const pdfFrame = document.getElementById('pdfFrame');
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');
    const downloadBtn = document.getElementById('downloadBtn');
    const externalBtn = document.getElementById('externalBtn');

    // Set page title
    if (titleParam) {
      const cleanTitle = decodeURIComponent(titleParam);
      docTitle.innerText = cleanTitle;
      document.title = `${cleanTitle} - BTechX Viewer`;
    }

    // Back button navigation
    function handleBack() {
      if (window.history.length > 1 && document.referrer) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }

    // Fullscreen toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.debug(err));
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Load PDF
    if (!fileParam || fileParam === '#' || fileParam.includes('javascript:void') || fileParam.trim() === '') {
      loadingState.style.display = 'none';
      errorState.style.display = 'flex';
      downloadBtn.style.display = 'none';
      externalBtn.style.display = 'none';
    } else {
      const cleanFile = decodeURIComponent(fileParam);
      downloadBtn.href = cleanFile;
      downloadBtn.setAttribute('download', cleanFile.split('/').pop());
      externalBtn.href = cleanFile;

      // Disable browser native PDF toolbars (Microsoft Edge, Chrome, Acrobat)
      // and fit page horizontally for distraction-free edge-to-edge reading
      const embedPdfUrl = `${cleanFile}#toolbar=0&navpanes=0&scrollbar=1&view=FitH`;

      // Verify file existence via HEAD request
      fetch(cleanFile, { method: 'HEAD' })
        .then(res => {
          if (res.ok) {
            pdfFrame.src = embedPdfUrl;
            pdfFrame.style.display = 'block';
            loadingState.style.display = 'none';
          } else {
            loadingState.style.display = 'none';
            errorState.style.display = 'flex';
            downloadBtn.style.display = 'none';
            externalBtn.style.display = 'none';
          }
        })
        .catch(() => {
          // Fallback for file:// or offline protocols
          pdfFrame.src = embedPdfUrl;
          pdfFrame.style.display = 'block';
          loadingState.style.display = 'none';
        });
    }
  </script>
  <script src="assets/js/version-check.js?v=15.6"></script>
</body>
</html>
